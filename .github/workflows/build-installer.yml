name: Build Thrive FileCopy Installer

on:
  push:
    branches: [ main, master, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: 'FileCopy/FileCopy'
  INSTALLER_PATH: 'FileCopy/FileCopy.Installer'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup WiX Toolset
      run: |
        dotnet tool install --global wix --version 4.0.5
        wix extension add WixToolset.Util.wixext/4.0.5
        wix extension add WixToolset.UI.wixext/4.0.5

    - name: Setup signtool
      uses: KamaranL/add-signtool-action@v1

    - name: Restore dependencies
      run: |
        # Restore the main service project
        dotnet restore ${{ env.PROJECT_PATH }}/FileCopy.csproj
        # Restore the installer project
        dotnet restore ${{ env.INSTALLER_PATH }}/FileCopy.Installer.wixproj

    - name: Get version info
      id: version
      run: |
        # Generate separate versions for GitHub and WiX
        $currentDate = Get-Date
        $year = $currentDate.Year
        $shortYear = $currentDate.Year % 100  # Last 2 digits (25 for 2025)
        $month = $currentDate.Month
        $day = $currentDate.Day

        Write-Host "GitHub ref: ${{ github.ref }}"
        Write-Host "GitHub run number: $env:GITHUB_RUN_NUMBER"

        # GitHub version format: YYYY.MM.DD or YYYY.MM.DD-dev
        if ("${{ github.ref }}" -eq "refs/heads/master") {
          $GITHUB_VERSION = "$year.$month.$day"
          $WIX_VERSION = "$shortYear.$month.$day.0"
          Write-Host "Master branch - release versions"
        } else {
          $GITHUB_VERSION = "$year.$month.$day-dev"
          $runNumber = $env:GITHUB_RUN_NUMBER
          if (-not $runNumber) {
            $runNumber = 1
          }
          $WIX_VERSION = "$shortYear.$month.$day.$runNumber"
          Write-Host "Dev branch - using run number: $runNumber"
        }

        Write-Host "GitHub version: $GITHUB_VERSION"
        Write-Host "WiX version: $WIX_VERSION"

        # Write to GitHub output
        "GITHUB_VERSION=$GITHUB_VERSION" >> $env:GITHUB_OUTPUT
        "WIX_VERSION=$WIX_VERSION" >> $env:GITHUB_OUTPUT
        "PACKAGE_NAME=ThriveFileCopyInstaller-$GITHUB_VERSION" >> $env:GITHUB_OUTPUT

    - name: Update installer version
      run: |
        $wixVersion = "${{ steps.version.outputs.WIX_VERSION }}"
        $githubVersion = "${{ steps.version.outputs.GITHUB_VERSION }}"
        Write-Host "Using WiX version: $wixVersion"
        Write-Host "Using GitHub version: $githubVersion"

        $wxsPath = "${{ env.INSTALLER_PATH }}/Product.wxs"
        Write-Host "Before update - checking current version in ${wxsPath}:"
        $beforeContent = Get-Content $wxsPath -Raw
        if ($beforeContent -match 'Version="([^"]*)"') {
          Write-Host "Current version: $($matches[1])"
        }

        $content = Get-Content $wxsPath -Raw
        $content = $content -replace 'Version="1\.0\.0\.0"', "Version=`"$wixVersion`""
        Set-Content $wxsPath $content

        Write-Host "After update - verifying version was updated:"
        $afterContent = Get-Content $wxsPath -Raw
        if ($afterContent -match 'Version="([^"]*)"') {
          Write-Host "New version: $($matches[1])"
        }

        Write-Host "Updated installer version to: $wixVersion"

    - name: Build MSI installer
      run: |
        try {
          Write-Host "Attempting to build MSI installer..."
          cd ${{ env.INSTALLER_PATH }}

          # Verify all required files exist
          Write-Host "Checking required files..."
          $requiredFiles = @("Product.wxs", "License.rtf", "FileCopy.Installer.wixproj")
          foreach ($file in $requiredFiles) {
            if (Test-Path $file) {
              Write-Host "✓ Found: $file"
            } else {
              Write-Host "✗ Missing: $file"
              throw "Required file missing: $file"
            }
          }

          # Verify version before build
          Write-Host "Verifying version in Product.wxs before build:"
          $wxsContent = Get-Content "Product.wxs" -Raw
          if ($wxsContent -match 'Version="([^"]*)"') {
            Write-Host "Product.wxs version before build: $($matches[1])"
          }

          # First, publish the service as single-file executable
          Write-Host "Publishing service as single-file executable..."
          dotnet publish ../FileCopy/FileCopy.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish-output --force

          # Verify published files exist
          if (Test-Path "publish-output/FileCopy.exe") {
            $exeSize = (Get-Item "publish-output/FileCopy.exe").Length
            Write-Host "✓ Published FileCopy.exe: $([math]::Round($exeSize / 1MB, 2)) MB"
          } else {
            throw "Failed to publish FileCopy.exe"
          }

          if (Test-Path "publish-output/appsettings.json") {
            Write-Host "✓ Published appsettings.json"
          } else {
            throw "Failed to publish appsettings.json"
          }

          # Build the installer (this will use the published files)
          Write-Host "Building installer..."
          dotnet build -c Release

          $msiExists = Test-Path "bin/Release/ThriveFileCopyInstaller.msi"
          if ($msiExists) {
            Write-Host "MSI installer built successfully"

            # Validate MSI file
            $msiPath = "bin/Release/ThriveFileCopyInstaller.msi"
            $msiSize = (Get-Item $msiPath).Length
            Write-Host "MSI file size: $([math]::Round($msiSize / 1MB, 2)) MB"

            # Basic MSI validation using msiexec
            Write-Host "Validating MSI structure..."
            $validateResult = & msiexec /a $msiPath /qn /L*v validate.log TARGETDIR="$PWD\validate-temp" 2>&1
            if ($LASTEXITCODE -eq 0) {
              Write-Host "MSI validation passed"
              Remove-Item "validate-temp" -Recurse -Force -ErrorAction SilentlyContinue
              Remove-Item "validate.log" -Force -ErrorAction SilentlyContinue
            } else {
              Write-Host "MSI validation warning (this may be normal): $validateResult"
            }

            # Code sign the MSI if certificate is available
            Write-Host "Checking for code signing certificate..."
            $certAvailable = $env:CODE_SIGNING_CERT_BASE64 -ne $null -and $env:CODE_SIGNING_CERT_BASE64 -ne ""
            $passwordAvailable = $env:CODE_SIGNING_CERT_PASSWORD -ne $null -and $env:CODE_SIGNING_CERT_PASSWORD -ne ""
            Write-Host "Certificate available: $certAvailable"
            Write-Host "Password available: $passwordAvailable"

            if ($env:CODE_SIGNING_CERT_BASE64 -and $env:CODE_SIGNING_CERT_PASSWORD) {
              Write-Host "Code signing certificate found, signing MSI..."
              try {
                # Decode certificate from base64
                $certBytes = [Convert]::FromBase64String($env:CODE_SIGNING_CERT_BASE64)
                $certPath = Join-Path $PWD "temp_cert.p12"
                [System.IO.File]::WriteAllBytes($certPath, $certBytes)

                Write-Host "Certificate saved to: $certPath"
                Write-Host "Certificate file exists: $(Test-Path $certPath)"

                # Sign the MSI
                $msiPath = Join-Path $PWD "bin/Release/ThriveFileCopyInstaller.msi"
                Write-Host "MSI path: $msiPath"
                Write-Host "MSI file exists: $(Test-Path $msiPath)"

                $signResult = & signtool sign /f $certPath /p $env:CODE_SIGNING_CERT_PASSWORD /t http://timestamp.digicert.com /fd SHA256 /v $msiPath

                if ($LASTEXITCODE -eq 0) {
                  Write-Host "MSI signed successfully"
                  "MSI_SIGNED=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
                } else {
                  Write-Host "MSI signing failed: $signResult"
                  "MSI_SIGNED=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
                }

                # Clean up certificate file
                Remove-Item $certPath -Force -ErrorAction SilentlyContinue
              } catch {
                Write-Host "Code signing error: $($_.Exception.Message)"
                "MSI_SIGNED=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              }
            } else {
              Write-Host "No code signing certificate configured - MSI will show 'Unknown Publisher'"
              "MSI_SIGNED=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            }

            "MSI_BUILT=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            Write-Host "MSI file not found after build"
            "MSI_BUILT=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "MSI_SIGNED=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
        } catch {
          Write-Host "MSI build failed: $($_.Exception.Message)"
          Write-Host "Will create PowerShell installer package instead"
          "MSI_BUILT=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        }
      id: build_msi
      env:
        CODE_SIGNING_CERT_BASE64: ${{ secrets.CODE_SIGNING_CERT_BASE64 }}
        CODE_SIGNING_CERT_PASSWORD: ${{ secrets.CODE_SIGNING_CERT_PASSWORD }}

    - name: Create release package
      run: |
        $githubVersion = "${{ steps.version.outputs.GITHUB_VERSION }}"
        $wixVersion = "${{ steps.version.outputs.WIX_VERSION }}"
        $packageName = "${{ steps.version.outputs.PACKAGE_NAME }}"
        Write-Host "GitHub version: $githubVersion"
        Write-Host "WiX version: $wixVersion"
        Write-Host "Package name: $packageName"
        
        # Create package directory
        New-Item -ItemType Directory -Path $packageName -Force
        
        # Copy MSI installer if it exists, otherwise create fallback package
        if ("${{ steps.build_msi.outputs.MSI_BUILT }}" -eq "true") {
          Write-Host "Copying MSI installer..."
          Copy-Item "${{ env.INSTALLER_PATH }}/bin/Release/ThriveFileCopyInstaller.msi" "$packageName/"

          # Also copy license for reference
          if (Test-Path "${{ env.INSTALLER_PATH }}/License.rtf") {
            Copy-Item "${{ env.INSTALLER_PATH }}/License.rtf" "$packageName/"
          }
        } else {
          Write-Host "MSI build failed - creating fallback package..."
          # Build service manually for fallback
          dotnet publish ${{ env.PROJECT_PATH }}/FileCopy.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -o "fallback-publish"

          # Copy service executable and config
          Copy-Item "fallback-publish/FileCopy.exe" "$packageName/"
          Copy-Item "fallback-publish/appsettings.json" "$packageName/"

          Write-Host "Creating fallback installer scripts..."

          # Copy fallback installer script
          Copy-Item "docs/INSTALL_MANUALLY.bat" "$packageName/"
        }
        
        # Copy documentation files
        Write-Host "Copying documentation..."
        Copy-Item "docs/QUICK_START.md" "$packageName/"

        "PACKAGE_NAME=$packageName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

    - name: Upload build artifacts
      uses: actions/upload-artifact@v6
      with:
        name: ${{ steps.version.outputs.PACKAGE_NAME }}
        path: |
          ${{ steps.version.outputs.PACKAGE_NAME }}/ThriveFileCopyInstaller.msi
          ${{ steps.version.outputs.PACKAGE_NAME }}/License.rtf
          ${{ steps.version.outputs.PACKAGE_NAME }}/FileCopy.exe
          ${{ steps.version.outputs.PACKAGE_NAME }}/appsettings.json
          ${{ steps.version.outputs.PACKAGE_NAME }}/QUICK_START.md
          ${{ steps.version.outputs.PACKAGE_NAME }}/INSTALL_MANUALLY.bat
        retention-days: 90

    - name: Create release ZIP
      if: github.ref == 'refs/heads/master'
      run: |
        $packageName = "${{ steps.version.outputs.PACKAGE_NAME }}"
        # Create ZIP package for release
        Compress-Archive -Path $packageName -DestinationPath "$packageName.zip"

    - name: Create Release
      if: github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.GITHUB_VERSION }}
        files: |
          ${{ steps.version.outputs.PACKAGE_NAME }}.zip
        name: Thrive FileCopy Service ${{ steps.version.outputs.GITHUB_VERSION }}
        body: |
          ## Thrive FileCopy Service v${{ steps.version.outputs.GITHUB_VERSION }}
          
          Automatically moves OBS recording files to NAS storage.
          
          ### 📦 Installation
          1. Download and extract `ThriveFileCopyInstaller-${{ steps.version.outputs.GITHUB_VERSION }}.zip`
          2. Double-click `ThriveFileCopyInstaller.msi`
          3. Follow the installation wizard
          4. **Start the service manually**: `Start-Service ThriveFileCopy` or use Services.msc
          
          ### ⚙️ Default Configuration
          - **Source**: `C:\temp\source-videos` (system-accessible directory)
          - **Destination**: `C:\temp\recordings-backup`
          - **File Type**: `.mkv` files ≥100MB (configurable)
          - **Check Interval**: Every 1 minute
          - **Retry Delay**: 5 minutes for locked files
          - **Service Account**: LocalSystem (for system-wide access)
          
          ### 🔧 Features
          - Automatic file monitoring
          - File lock detection (won't interfere with OBS recording)
          - Retry logic for locked files
          - Robocopy-style functionality (native C# implementation)
          - Comprehensive logging
          - Windows service (runs in background)
          
          ### 📋 Monitoring
          - **Service Name**: `ThriveFileCopy`
          - **Logs**: `C:\logs\Thrive\filecopy_log.txt`
          - **Status**: `Get-Service ThriveFileCopy`
          
          ### 📖 Documentation
          See the included documentation files for detailed configuration and troubleshooting.
        draft: false
        prerelease: ${{ contains(steps.version.outputs.GITHUB_VERSION, '-dev') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
