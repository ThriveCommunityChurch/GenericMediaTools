name: Build Thrive FileCopy Installer

on:
  push:
    branches: [ main, master, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: 'FileCopy/FileCopy'
  INSTALLER_PATH: 'FileCopy/FileCopy.Installer'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup WiX Toolset
      run: |
        dotnet tool install --global wix --version 4.0.5
        wix extension add WixToolset.Util.wixext/4.0.5

    - name: Restore dependencies
      run: dotnet restore ${{ env.PROJECT_PATH }}/FileCopy.csproj

    - name: Build service (Single File)
      run: |
        dotnet publish ${{ env.PROJECT_PATH }}/FileCopy.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:PublishTrimmed=true `
          -o "publish"

    - name: Get version info
      id: version
      run: |
        # Generate separate versions for GitHub and WiX
        $currentDate = Get-Date
        $year = $currentDate.Year
        $shortYear = $currentDate.Year % 100  # Last 2 digits (25 for 2025)
        $month = $currentDate.Month
        $day = $currentDate.Day

        Write-Host "GitHub ref: ${{ github.ref }}"
        Write-Host "GitHub run number: $env:GITHUB_RUN_NUMBER"

        # GitHub version format: YYYY.MM.DD or YYYY.MM.DD-dev
        if ("${{ github.ref }}" -eq "refs/heads/master") {
          $GITHUB_VERSION = "$year.$month.$day"
          $WIX_VERSION = "$shortYear.$month.$day.0"
          Write-Host "Master branch - release versions"
        } else {
          $GITHUB_VERSION = "$year.$month.$day-dev"
          $runNumber = $env:GITHUB_RUN_NUMBER
          if (-not $runNumber) {
            $runNumber = 1
          }
          $WIX_VERSION = "$shortYear.$month.$day.$runNumber"
          Write-Host "Dev branch - using run number: $runNumber"
        }

        Write-Host "GitHub version: $GITHUB_VERSION"
        Write-Host "WiX version: $WIX_VERSION"

        # Write to GitHub output
        "GITHUB_VERSION=$GITHUB_VERSION" >> $env:GITHUB_OUTPUT
        "WIX_VERSION=$WIX_VERSION" >> $env:GITHUB_OUTPUT
        "PACKAGE_NAME=ThriveFileCopyInstaller-$GITHUB_VERSION" >> $env:GITHUB_OUTPUT

    - name: Update installer version
      run: |
        $wixVersion = "${{ steps.version.outputs.WIX_VERSION }}"
        $githubVersion = "${{ steps.version.outputs.GITHUB_VERSION }}"
        Write-Host "Using WiX version: $wixVersion"
        Write-Host "Using GitHub version: $githubVersion"

        $wxsPath = "${{ env.INSTALLER_PATH }}/Product.wxs"
        $content = Get-Content $wxsPath -Raw
        $content = $content -replace 'Version="1\.0\.0\.0"', "Version=`"$wixVersion`""
        Set-Content $wxsPath $content
        Write-Host "Updated installer version to: $wixVersion"

    - name: Build MSI installer
      run: |
        try {
          Write-Host "Attempting to build MSI installer..."
          cd ${{ env.INSTALLER_PATH }}

          # Try to restore first
          Write-Host "Restoring installer project..."
          dotnet restore

          # Build the installer
          Write-Host "Building installer..."
          dotnet build -c Release

          $msiExists = Test-Path "bin/Release/ThriveFileCopyInstaller.msi"
          if ($msiExists) {
            Write-Host "MSI installer built successfully"
            "MSI_BUILT=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            Write-Host "MSI file not found after build"
            "MSI_BUILT=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
        } catch {
          Write-Host "MSI build failed: $($_.Exception.Message)"
          Write-Host "Will create PowerShell installer package instead"
          "MSI_BUILT=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        }
      id: build_msi

    - name: Create release package
      run: |
        $githubVersion = "${{ steps.version.outputs.GITHUB_VERSION }}"
        $wixVersion = "${{ steps.version.outputs.WIX_VERSION }}"
        $packageName = "${{ steps.version.outputs.PACKAGE_NAME }}"
        Write-Host "GitHub version: $githubVersion"
        Write-Host "WiX version: $wixVersion"
        Write-Host "Package name: $packageName"
        
        # Create package directory
        New-Item -ItemType Directory -Path $packageName -Force
        
        # Copy MSI installer if it exists, otherwise copy PowerShell installer
        if ("${{ steps.build_msi.outputs.MSI_BUILT }}" -eq "true") {
          Copy-Item "${{ env.INSTALLER_PATH }}/bin/Release/ThriveFileCopyInstaller.msi" "$packageName/"
        } else {
          # Copy service executable and config
          Copy-Item "publish/FileCopy.exe" "$packageName/"
          Copy-Item "publish/appsettings.json" "$packageName/"

          # Verify the config has the correct default paths
          Write-Host "Verifying configuration defaults..."
          $configContent = Get-Content "publish/appsettings.json" -Raw
          if ($configContent -notlike "*%USERPROFILE%*") {
            Write-Warning "Configuration may not have dynamic user profile path"
          }

          Write-Host "Creating installer scripts..."
          # Note: Installer scripts will be created from templates in future versions
        }
        
        # Create documentation inline (since installer folder is gitignored)
        Write-Host "Creating documentation..."
        
        # Create quick start guide
        @"
        # Thrive FileCopy Service - Quick Start (Single File Edition)

        ## Installation (30 seconds)

        ### Option 1: MSI Installer (Recommended)
        1. Right-click on 'ThriveFileCopyInstaller.msi' and select 'Run as administrator'
        2. Follow the installation wizard
        3. The service will start automatically after installation

        ### Option 2: Single File Installer
        1. Right-click on 'Install.bat' and select 'Run as administrator'
        2. Follow the prompts
        3. Done! Just one FileCopy.exe file (14MB) - no DLLs!
        
        ## Default Configuration
        - **Source**: %USERPROFILE%\Videos (current user's Videos folder)
        - **Destination**: Z:\Backups\Recordings
        - **File Type**: .mkv files ≥100MB (configurable)
        - **Check Interval**: Every 1 minute
        - **Retry Delay**: 5 minutes for locked files
        
        ## Monitoring
        - **Service Name**: ThriveFileCopy
        - **Logs**: C:\logs\Thrive\filecopy_log.txt
        - **Status Check**: Services.msc or ``Get-Service ThriveFileCopy``
        
        ## Configuration
        After installation, you can modify settings by editing:
        ``C:\Program Files\Thrive Community Church\FileCopy Service\appsettings.json``
        
        Then restart the service:
        ``Restart-Service ThriveFileCopy``
        
        ## Features
        - ✅ Automatic file monitoring
        - ✅ File lock detection (won't interfere with OBS recording)
        - ✅ Retry logic for locked files  
        - ✅ Robocopy-style functionality (native C# implementation)
        - ✅ Comprehensive logging
        - ✅ Windows service (runs in background)
        
        ## Support
        For issues, check the log file or visit:
        https://github.com/ThriveCommunityChurch/GenericMediaTools
        "@ | Out-File "$packageName/QUICK_START.md" -Encoding UTF8

        "PACKAGE_NAME=$packageName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.version.outputs.PACKAGE_NAME }}
        path: |
          ${{ steps.version.outputs.PACKAGE_NAME }}/ThriveFileCopyInstaller.msi
          ${{ steps.version.outputs.PACKAGE_NAME }}/FileCopy.exe
          ${{ steps.version.outputs.PACKAGE_NAME }}/appsettings.json
          ${{ steps.version.outputs.PACKAGE_NAME }}/QUICK_START.md
        retention-days: 90

    - name: Create release ZIP
      if: github.ref == 'refs/heads/master'
      run: |
        $packageName = "${{ steps.version.outputs.PACKAGE_NAME }}"
        # Create ZIP package for release
        Compress-Archive -Path $packageName -DestinationPath "$packageName.zip"

    - name: Create Release
      if: github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.GITHUB_VERSION }}
        files: |
          ${{ steps.version.outputs.PACKAGE_NAME }}.zip
        name: Thrive FileCopy Service ${{ steps.version.outputs.GITHUB_VERSION }}
        body: |
          ## Thrive FileCopy Service v${{ steps.version.outputs.GITHUB_VERSION }}
          
          Automatically moves OBS recording files to NAS storage.
          
          ### 📦 Installation
          1. Download and extract `ThriveFileCopyInstaller-${{ steps.version.outputs.GITHUB_VERSION }}.zip`
          2. Right-click `Install.bat` and select "Run as administrator"
          3. Follow the installation prompts
          4. Service starts automatically
          
          ### ⚙️ Default Configuration
          - **Source**: `%USERPROFILE%\Videos` (current user's Videos folder)
          - **Destination**: `Z:\Backups\Recordings`
          - **File Type**: `.mkv` files ≥100MB (configurable)
          - **Check Interval**: Every 1 minute
          - **Retry Delay**: 5 minutes for locked files
          
          ### 🔧 Features
          - Automatic file monitoring
          - File lock detection (won't interfere with OBS recording)
          - Retry logic for locked files
          - Robocopy-style functionality (native C# implementation)
          - Comprehensive logging
          - Windows service (runs in background)
          
          ### 📋 Monitoring
          - **Service Name**: `ThriveFileCopy`
          - **Logs**: `C:\logs\Thrive\filecopy_log.txt`
          - **Status**: `Get-Service ThriveFileCopy`
          
          ### 📖 Documentation
          See the included documentation files for detailed configuration and troubleshooting.
        draft: false
        prerelease: ${{ contains(steps.version.outputs.GITHUB_VERSION, '-dev') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
